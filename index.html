<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7e9ed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kotori 日語學園">
<title>Kotori 日本語學園 2.9.1</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
<header class="compact-header">
 <div class="level-progress"><div class="level-label" id="level">Lv.1</div><div class="xp-track"><i id="xpFill" style="width:0%"></i></div><div class="xp-count"><b id="xpCurrent">0</b>/<span id="xpGoal">100</span> XP</div></div>
 <div class="coin-pill">🪙 <b id="coins">0</b></div>
</header>
<main id="main"></main>
<nav class="nav">
 <button data-page="home" class="active"><b>⌂</b>首頁</button>
 <button data-page="map"><b>🗺️</b>學習地圖</button>
 <button data-page="profile"><b>♡</b>我的</button>
</nav>
<footer>Kotori 2.9.1 · Academy Journey · 每天一點點，日文慢慢進步。🌸</footer>
</div>
<script src="js/data/content.js"></script>
<script src="js/app.js"></script>
<script>
// Prevent iOS Safari pinch gestures from resizing the learning interface.
document.addEventListener('gesturestart', event => event.preventDefault(), {passive:false});
document.addEventListener('gesturechange', event => event.preventDefault(), {passive:false});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service worker registration failed:', err));
  });
}
</script>
</body>
</html>
